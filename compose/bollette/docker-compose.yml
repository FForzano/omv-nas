name: bollette
services:
  bollette:
    # Immagine costruita dalla CI del repository (https://github.com/FForzano/lg-invoices-analyzer)
    image: ghcr.io/fforzano/lg-invoices-analyzer:latest
    container_name: bollette
    user: 1000:100
    ports:
      - "8090:8080"
    environment:
      - TZ=Europe/Rome
      - SECRET_KEY=${SECRET_KEY}
      # Facoltativo, lasciala disattivata per non inviare mai dati fuori dal NAS.
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - CHANGE_TO_COMPOSE_DATA_PATH/bollette/data:/data
    restart: unless-stopped
